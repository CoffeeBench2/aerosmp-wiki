name: Deploy wiki to GitHub Pages

# The workflows Quartz ships are the UPSTREAM PROJECT's own CI — they build
# Quartz's docs to Cloudflare Pages and are gated on
# `github.repository == 'jackyzha0/quartz'`, so they can never deploy this site.
# They were removed and replaced with this one.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy by hand without pushing

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Not cancel-in-progress: a half-finished Pages
# deploy that gets cancelled can leave the live site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Quartz reads git history to show created/modified dates on pages.
          # A shallow clone makes every page claim it was written today.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx quartz build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
